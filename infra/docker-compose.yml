# Run from the repo root:
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
# (--env-file is needed because Compose otherwise looks for .env next to this file.)
name: murray

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD:?set in .env}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?set in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  # All-in-one: master + volume + filer + S3 gateway in one process.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: >
      server -s3 -ip=seaweedfs -ip.bind=0.0.0.0
      -master.telemetry=false
    environment:
      # SeaweedFS creates an admin S3 identity from these (no s3.json needed).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  # One-off job: exits 0 whether or not the bucket already exists.
  create-bucket:
    image: amazon/aws-cli:2.38.5
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://seaweedfs:8333
    entrypoint: ["sh", "-c"]
    command:
      - aws s3api head-bucket --bucket lakehouse 2>/dev/null
        && echo "bucket lakehouse already exists"
        || aws s3api create-bucket --bucket lakehouse
    mem_limit: 256m
    restart: "no"

  # Tracking server + model registry. Metadata → Postgres (mlflow DB), artifacts → S3.
  # --serve-artifacts: clients upload/download artifacts *through* this server, so
  # training code needs only MLFLOW_TRACKING_URI, never S3 credentials.
  mlflow:
    build: ./mlflow
    image: murray/mlflow:3.17.2
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?set in .env}@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      # MLflow 3 starts ~7 background job workers (GenAI scoring, trace archival),
      # ~200 MB each. Not needed for classic tracking + registry.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000 --workers 1
      --serve-artifacts --artifacts-destination s3://lakehouse/mlflow
      --allowed-hosts localhost,localhost:*,127.0.0.1:*,mlflow,mlflow:*
    ports:
      - "127.0.0.1:5050:5000"   # 5000 on macOS is taken by AirPlay Receiver
    healthcheck:
      # No curl in this image; use Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 768m
    restart: unless-stopped

  # Feast online store: latest feature values per entity, read at inference time.
  # It is a *derived* cache (rebuilt by `feast materialize` from the Iceberg offline store),
  # so persistence is a convenience for restarts, not the source of truth.
  valkey:
    image: valkey/valkey:9.1.2-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?set in .env}   # lets valkey-cli in the healthcheck auth without -a
    command:
      - sh
      - -c
      - >-
        exec valkey-server
        --requirepass "$$VALKEY_PASSWORD"
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --save 300 1
        --appendonly no
    volumes:
      - valkey-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped

volumes:
  pgdata:
  seaweedfs-data:
  valkey-data:
